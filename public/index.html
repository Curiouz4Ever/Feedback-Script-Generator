<title>Say It Easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EC;
    --surface:#FFFFFF;
    --surface-2:#F3EEE0;
    --border:#E6DFCC;
    --ink:#211D17;
    --ink-soft:#4A4335;
    --muted:#756C5C;
    --primary:#8A6D2E;
    --primary-ink:#ffffff;
    --focus:#8A6D2E;

    --direct:#9C4221;
    --direct-tint:#FBEEE7;
    --coaching:#2F6F4E;
    --coaching-tint:#EAF4EE;
    --supportive:#6B4C7A;
    --supportive-tint:#F3ECF5;

    --radius:12px;
    --shadow: 0 1px 2px rgba(20,22,26,0.05), 0 10px 28px rgba(20,22,26,0.06);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{ padding:0 0 64px 0; }

  .wrap{
    max-width:1160px;
    margin:0 auto;
    padding:0 32px;
  }

  header.page{
    padding:44px 32px 8px 32px;
    max-width:1160px;
    margin:0 auto;
  }

  header.page h1{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-size:38px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0 0 10px 0;
    color:var(--ink);
  }

  header.page p{
    margin:0;
    font-size:15px;
    color:var(--ink-soft);
    max-width:580px;
    line-height:1.5;
  }

  .app{
    display:grid;
    grid-template-columns:minmax(320px,440px) 1fr;
    gap:28px;
    align-items:start;
    margin-top:32px;
  }

  @media (max-width:900px){
    .app{ grid-template-columns:1fr; }
    header.page{ padding:32px 16px 4px 16px; }
    .wrap{ padding:0 16px; }
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---------- form ---------- */

  .form-card{ padding:28px; }

  .form-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:20px;
  }

  .form-head h2{
    font-size:15px;
    font-weight:650;
    margin:0;
  }

  .clear-link{
    font-size:13px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    font-family:inherit;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .clear-link:hover{ color:var(--ink-soft); }

  .field{ margin-bottom:20px; }

  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-bottom:6px;
